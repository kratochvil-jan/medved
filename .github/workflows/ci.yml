on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.23.2
      - name: Run pytest
        run: nix develop --command uv run --all-extras pytest --verbose
